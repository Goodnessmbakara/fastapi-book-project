name: Deploy FastAPI Application

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    needs: []  # No dependencies since test job runs in separate workflow
    
    steps:
    - name: Check out repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v4
      with:
        context: .
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:latest
        
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          # Pull the latest image
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:latest
          
          # Stop and remove existing container
          docker stop fastapi-app || true
          docker rm fastapi-app || true
          
          # Run new container
          docker run -d \
            --name fastapi-app \
            --restart unless-stopped \
            -p 8000:8000 \
            ${{ secrets.DOCKERHUB_USERNAME }}/fastapi-app:latest
          
          # Verify container is running
          docker ps | grep fastapi-app